<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotionLife — Character Motion (duck walking)</title>
<style>
  body{margin:0;background:#0b0d1a;color:#f4f1ea;font-family:-apple-system,Segoe UI,Helvetica,sans-serif;
       display:flex;flex-direction:column;align-items:center;min-height:100vh}
  header{padding:1.4rem;text-align:center}
  h1{margin:0;font-size:1.4rem;font-weight:800}
  h1 .g{background:linear-gradient(90deg,#22d3ee,#8b5cf6,#fb7185);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin:.4rem 0 0;color:#9aa0b5;font-size:.9rem}
  .stage{display:flex;gap:2rem;flex-wrap:wrap;justify-content:center;align-items:center}
  .panel{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:1rem}
  .cap{text-align:center;color:#9aa0b5;font-size:.8rem;margin-top:.4rem;letter-spacing:.05em}
  svg{display:block}
  .controls{margin:1.2rem;display:flex;gap:1rem;align-items:center}
  button{background:linear-gradient(100deg,#22d3ee,#8b5cf6);border:none;color:#04121a;font-weight:700;
         padding:.6rem 1.4rem;border-radius:10px;cursor:pointer;font-size:.95rem}
  label{color:#9aa0b5;font-size:.85rem;display:flex;align-items:center;gap:.5rem}
  input[type=range]{width:120px}
  .badge{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#34d399;border:1px solid rgba(52,211,153,.4);
         padding:.2rem .6rem;border-radius:999px}
</style>
</head>
<body>
  <header>
    <h1>Motion<span class="g">Life</span> — character motion</h1>
    <p>Real walk captured from a video with pose estimation, applied to a rigged duck. <span class="badge">no hardcoded motion</span></p>
  </header>

  <div class="stage">
    <div class="panel">
      <svg id="skel" width="300" height="360" viewBox="0 0 300 360"></svg>
      <div class="cap">SOURCE — captured skeleton</div>
    </div>
    <div class="panel">
      <svg id="duck" width="460" height="420" viewBox="0 0 460 420"></svg>
      <div class="cap">TARGET — the duck, driven by that walk</div>
    </div>
  </div>

  <div class="controls">
    <button id="upload">⬆ Upload walking video</button>
    <input id="file" type="file" accept="video/*" hidden>
    <button id="play">⏸ Pause</button>
    <label>Speed <input id="speed" type="range" min="0.3" max="2" step="0.1" value="1"></label>
    <label>Stride <input id="stride" type="range" min="0.6" max="1.6" step="0.05" value="1"></label>
  </div>
  <div id="ustatus" style="color:#9aa0b5;font-size:.85rem;min-height:1.2em"></div>

<script>
const SVGNS="http://www.w3.org/2000/svg";
let POSE=null, J={};
const skel=document.getElementById('skel'), duck=document.getElementById('duck');

// ---- build the duck rig once (body/head/wing + two articulated legs) ----
function el(tag,attrs){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
// legs drawn first (behind body)
const legFar = el('polyline',{fill:'none',stroke:'#e8892b',"stroke-width":9,"stroke-linecap":"round","stroke-linejoin":"round",opacity:.75});
const footFar= el('ellipse',{fill:'#e8892b',rx:16,ry:6,opacity:.75});
const legNear= el('polyline',{fill:'none',stroke:'#f0a030',"stroke-width":10,"stroke-linecap":"round","stroke-linejoin":"round"});
const footNear=el('ellipse',{fill:'#f0a030',rx:18,ry:7});
duck.append(legFar,footFar,legNear,footNear);
// body group (bobs/tilts)
const body=el('g',{});
body.append(
  el('ellipse',{cx:0,cy:0,rx:96,ry:70,fill:'#ffd23f'}),                 // body
  el('path',{d:'M -96 -6 q -46 -6 -70 -34 q 44 8 70 6 Z',fill:'#f2c02e'}),// tail (back-left)
  el('ellipse',{cx:22,cy:6,rx:52,ry:40,fill:'#f7c62f'}),                // wing
  el('path',{d:'M 44 -40 q 42 -18 60 -70 q 6 40 -14 78 Z',fill:'#ffd23f'})// neck
);
// head group (child of body-ish; we place absolutely)
const head=el('g',{});
head.append(
  el('circle',{cx:0,cy:0,r:38,fill:'#ffd23f'}),
  el('path',{d:'M 30 -4 l 46 8 l -46 14 Z',fill:'#f28c1e'}),            // beak
  el('circle',{cx:-6,cy:-10,r:6,fill:'#1a1a2a'}),                       // eye
  el('circle',{cx:-8,cy:-12,r:2,fill:'#fff'})
);
duck.append(body,head);

// ---- skeleton preview bones ----
const BONES=[["l_sho","r_sho"],["l_sho","l_hip"],["r_sho","r_hip"],["l_hip","r_hip"],
  ["l_sho","l_elb"],["l_elb","l_wri"],["r_sho","r_elb"],["r_elb","r_wri"],
  ["l_hip","l_knee"],["l_knee","l_ank"],["r_hip","r_knee"],["r_knee","r_ank"],
  ["nose","l_sho"],["nose","r_sho"]];
const skelLines=BONES.map(()=>el('line',{stroke:'#b48cff',"stroke-width":4,"stroke-linecap":"round"}));
const skelHead=el('circle',{r:11,fill:'#e6dc96'});
skel.append(...skelLines,skelHead);

// ---- animation ----
let t0=performance.now(), playing=true, meanHipY=0, meanNoseY=0;
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'⏸ Pause':'▶ Play';if(playing){t0=performance.now();req();}};
const spd=()=>parseFloat(document.getElementById('speed').value);
const strd=()=>parseFloat(document.getElementById('stride').value);

function frameAt(t){const n=POSE.frames.length;const f=(t*POSE.fps)%n;return POSE.frames[Math.floor(f)];}

function mid(a,b){return [(a[0]+b[0])/2,(a[1]+b[1])/2];}

function draw(){
  const t=(performance.now()-t0)/1000*spd();
  const f=frameAt(t);
  // ---- skeleton preview (normalized → panel) ----
  const SX=x=>60+x*180, SY=y=>30+y*300;
  BONES.forEach((b,i)=>{const a=f[J[b[0]]],c=f[J[b[1]]];skelLines[i].setAttribute('x1',SX(a[0]));skelLines[i].setAttribute('y1',SY(a[1]));skelLines[i].setAttribute('x2',SX(c[0]));skelLines[i].setAttribute('y2',SY(c[1]));});
  const nose=f[J.nose];skelHead.setAttribute('cx',SX(nose[0]));skelHead.setAttribute('cy',SY(nose[1]));

  // ---- drive the duck ----
  const hipC=mid(f[J.l_hip],f[J.r_hip]);
  const shoC=mid(f[J.l_sho],f[J.r_sho]);
  const bodyCx=230, baseY=210;
  const bob=(hipC[1]-meanHipY)*150;               // vertical body bob from real hip
  const tilt=Math.atan2(shoC[1]-hipC[1], (shoC[0]-hipC[0])||0.001);
  const bodyCy=baseY+bob;
  body.setAttribute('transform',`translate(${bodyCx} ${bodyCy}) rotate(${(tilt*180/Math.PI+ -90).toFixed(1)*0.12})`);
  // head placed forward-up of body, bobbing with nose
  const headX=bodyCx+96, headY=bodyCy-64+(nose[1]-meanNoseY)*60;
  head.setAttribute('transform',`translate(${headX} ${headY})`);

  // legs: map each human leg (hip→knee→ankle) under the duck, scaled
  const LEG=170*strd(), hipY=bodyCy+52;
  function leg(hip,knee,ank,anchorX,line,foot){
    const h=f[J[hip]],k=f[J[knee]],a=f[J[ank]];
    const hx=bodyCx+anchorX, hy=hipY;
    const kx=hx+(k[0]-h[0])*LEG, ky=hy+(k[1]-h[1])*LEG;
    const ax=hx+(a[0]-h[0])*LEG, ay=hy+(a[1]-h[1])*LEG;
    line.setAttribute('points',`${hx},${hy} ${kx},${ky} ${ax},${ay}`);
    foot.setAttribute('cx',ax+8); foot.setAttribute('cy',ay+2);
  }
  leg('r_hip','r_knee','r_ank',-14,legFar,footFar);   // far leg
  leg('l_hip','l_knee','l_ank', 14,legNear,footNear); // near leg
  if(playing) req();
}
function req(){requestAnimationFrame(draw);}

function loadPose(d){
  POSE={joints:d.joints, fps:d.fps, frames:d.frames.filter(f=>f)};
  J={}; d.joints.forEach((n,i)=>J[n]=i);
  let sh=0,sn=0; for(const f of POSE.frames){sh+=(f[J.l_hip][1]+f[J.r_hip][1])/2; sn+=f[J.nose][1];}
  meanHipY=sh/POSE.frames.length; meanNoseY=sn/POSE.frames.length;
  t0=performance.now(); if(playing) req();
}

fetch('assets/motion/walk-pose.json').then(r=>r.json()).then(loadPose)
  .catch(()=>{document.querySelector('header p').textContent='Could not load walk-pose.json — run via http:// (localhost:8000)';});

// ---- upload a walking video → extract motion → drive the duck ----
const POSE_SVC = 'http://127.0.0.1:8770/extract';
const ust = document.getElementById('ustatus');
document.getElementById('upload').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async (e)=>{
  const f=e.target.files[0]; if(!f) return;
  ust.textContent='Uploading & extracting motion with MediaPipe… (first run downloads the model, ~10–20s)';
  try{
    const resp=await fetch(POSE_SVC,{method:'POST',body:f});
    const d=await resp.json();
    if(d.error) throw new Error(d.error);
    if(!d.detected){ ust.textContent='No person detected in that clip — try a clear, full-body walking video.'; return; }
    loadPose(d);
    ust.textContent=`✓ Extracted a walk from "${f.name}" — ${d.detected}/${d.total} frames. The duck now walks like your video.`;
  }catch(err){
    ust.textContent='Could not reach the pose service. Start it:  service/pose_server.py  (port 8770). '+err.message;
  }
  e.target.value='';
};
</script>
</body>
</html>
