<svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ml-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd7a0"/><stop offset="38%" stop-color="#ffc0a2"/>
      <stop offset="70%" stop-color="#e9a7b0"/><stop offset="100%" stop-color="#b7a0c8"/>
    </linearGradient>
    <radialGradient id="ml-sun" cx="0.5" cy="0.34" r="0.34">
      <stop offset="0%" stop-color="#fff8e6"/><stop offset="50%" stop-color="#ffe4b0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe4b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ml-mtn-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a86b4"/><stop offset="100%" stop-color="#7d6ba0"/>
    </linearGradient>
    <linearGradient id="ml-mtn-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5f5288"/><stop offset="100%" stop-color="#453a68"/>
    </linearGradient>
    <linearGradient id="ml-lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c39a"/><stop offset="45%" stop-color="#c99aae"/><stop offset="100%" stop-color="#6a5c8e"/>
    </linearGradient>
    <filter id="ml-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect id="ml-sky" width="1280" height="800" fill="url(#ml-sky)"/>
  <rect id="ml-sunglow" width="1280" height="520" fill="url(#ml-sun)"/>
  <circle id="ml-sun-disc" cx="640" cy="230" r="52" fill="#fff8e6"/>
  <!-- mountain ranges (static) -->
  <path id="ml-mtn-far" d="M 0,430 L 180,300 L 320,410 L 480,270 L 640,400 L 820,280 L 1000,400 L 1160,320 L 1280,410 L 1280,470 L 0,470 Z" fill="url(#ml-mtn-far)"/>
  <g id="ml-snow" fill="#fdf3ec" opacity="0.9">
    <path d="M 480,270 L 512,320 L 448,320 Z"/><path d="M 820,280 L 852,330 L 788,330 Z"/><path d="M 180,300 L 208,344 L 152,344 Z"/>
  </g>
  <path id="ml-mtn-near" d="M 0,480 L 220,360 L 420,470 L 640,380 L 880,480 L 1120,400 L 1280,470 L 1280,520 L 0,520 Z" fill="url(#ml-mtn-near)"/>
  <!-- lake -->
  <rect id="ml-lake-rect" x="0" y="500" width="1280" height="300" fill="url(#ml-lake)"/>
  <g id="ml-lakepath" fill="#fff0d8" opacity="0.4">
    <rect x="580" y="524" width="120" height="6" rx="3"/><rect x="560" y="556" width="160" height="6" rx="3"/>
    <rect x="590" y="588" width="100" height="5" rx="2"/>
  </g>
  <!-- pine trees on shore (static bases) -->
  <g id="ml-pines" fill="#3a3058">
    <path d="M 120,520 L 150,440 L 180,520 Z"/><path d="M 128,490 L 150,430 L 172,490 Z"/><rect x="146" y="518" width="8" height="24"/>
    <path d="M 1100,520 L 1130,448 L 1160,520 Z"/><path d="M 1108,492 L 1130,438 L 1152,492 Z"/><rect x="1126" y="518" width="8" height="24"/>
  </g>

  <!-- ===== ANIMATABLE LAYERS ===== -->

  <!-- 1) LAKE — ripple -->
  <g class="layer" data-name="lake">
    <path d="M 0,520 L 1280,520 L 1280,690 C 1000,674 760,684 460,678 C 240,674 120,682 0,690 Z" fill="url(#ml-lake)" opacity="0.9"/>
    <path d="M 120,560 C 360,550 620,562 900,556" stroke="#f0d0b0" stroke-width="4" fill="none" opacity="0.5"/>
    <path d="M 200,600 C 440,590 700,600 1000,594" stroke="#d0a8bc" stroke-width="3" fill="none" opacity="0.4"/>
    <path d="M 80,644 C 340,636 600,644 920,640" stroke="#c09ab8" stroke-width="3" fill="none" opacity="0.35"/>
  </g>

  <!-- 2) BOAT — bob -->
  <g class="layer" data-name="boat">
    <path d="M 360,616 C 388,644 492,644 520,616 C 488,630 392,630 360,616 Z" fill="#2e2648"/>
    <rect x="436" y="572" width="4" height="44" fill="#4a3f68"/>
    <path d="M 440,576 L 478,602 L 440,606 Z" fill="#e79a86" opacity="0.9"/>
  </g>

  <!-- 3) BIRDS — flight -->
  <g class="layer" data-name="birds">
    <g stroke="#6a5580" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M 820,160 C 832,152 844,152 856,160"/><path d="M 880,180 C 892,172 904,172 916,180"/>
      <path d="M 940,150 C 952,142 964,142 976,150"/><path d="M 900,140 C 912,132 924,132 936,140"/>
      <path d="M 780,190 C 792,182 804,182 816,190"/>
    </g>
  </g>

  <!-- 4) CLOUDS — drift -->
  <g class="layer" data-name="clouds" opacity="0.85">
    <g fill="#fff2e4" filter="url(#ml-soft)">
      <ellipse cx="280" cy="150" rx="120" ry="30"/><ellipse cx="350" cy="172" rx="82" ry="24"/>
      <ellipse cx="1000" cy="120" rx="110" ry="28"/><ellipse cx="1070" cy="140" rx="74" ry="22"/>
    </g>
  </g>

  <!-- title -->
  <g class="layer" data-name="title">
    <text x="640" y="756" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
      font-size="46" font-weight="700" letter-spacing="3" fill="#3a2d52" opacity="0.9">Alpine Mirror</text>
  </g>
</svg>
