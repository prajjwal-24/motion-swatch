<svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hb-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffd9a0"/>
      <stop offset="42%" stop-color="#ffb787"/>
      <stop offset="78%" stop-color="#f2937f"/>
      <stop offset="100%" stop-color="#c97a86"/>
    </linearGradient>
    <radialGradient id="hb-sun" cx="0.5" cy="0.46" r="0.34">
      <stop offset="0%" stop-color="#fff6e6"/>
      <stop offset="55%" stop-color="#ffe0a8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffe0a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hb-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7a878"/>
      <stop offset="40%" stop-color="#b98a86"/>
      <stop offset="100%" stop-color="#6e6193"/>
    </linearGradient>
    <linearGradient id="hb-flag1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff6a4d"/><stop offset="100%" stop-color="#e23b2e"/></linearGradient>
    <linearGradient id="hb-flag2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4cc9ff"/><stop offset="100%" stop-color="#2f8fd0"/></linearGradient>
    <filter id="hb-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- ===== STATIC BACKDROP ===== -->
  <rect id="hb-sky" width="1280" height="800" fill="url(#hb-sky)"/>
  <rect id="hb-sun-glow" width="1280" height="560" fill="url(#hb-sun)"/>
  <circle id="hb-sun" cx="640" cy="330" r="58" fill="#fff6e6"/>
  <!-- headland -->
  <path id="hb-headland" d="M 0,470 C 160,440 340,458 520,452 L 520,500 L 0,500 Z" fill="#8f6f86" opacity="0.85"/>
  <path id="hb-headland2" d="M 820,468 C 980,444 1140,458 1280,450 L 1280,500 L 820,500 Z" fill="#8f6f86" opacity="0.8"/>
  <!-- sea -->
  <rect id="hb-sea" x="0" y="480" width="1280" height="320" fill="url(#hb-sea)"/>
  <!-- sun path on water (static shimmer strips) -->
  <g id="hb-sunpath" fill="#ffe6bd" opacity="0.5">
    <rect x="596" y="500" width="88" height="6" rx="3"/>
    <rect x="580" y="524" width="120" height="6" rx="3"/>
    <rect x="596" y="548" width="88" height="5" rx="3"/>
  </g>
  <!-- dock (static) -->
  <rect id="hb-dock" x="0" y="700" width="1280" height="100" fill="#3a2e3e"/>
  <g id="hb-dockposts" fill="#2a2130">
    <rect x="120" y="668" width="12" height="40"/><rect x="360" y="668" width="12" height="40"/>
    <rect x="900" y="668" width="12" height="40"/><rect x="1140" y="668" width="12" height="40"/>
  </g>
  <!-- masts (static; behind sea so hulls sit in the water) -->
  <g id="hb-masts">
    <rect x="292" y="470" width="5" height="140" fill="#4a3a52"/>
    <rect x="1015" y="486" width="5" height="130" fill="#4a3a52"/>
  </g>

  <!-- ===== ANIMATABLE LAYERS ===== -->

  <!-- 1) SEA — wave ripple motion -->
  <g class="layer" data-name="sea">
    <path d="M 0,600 C 200,588 420,600 680,594 C 920,588 1120,598 1280,592 L 1280,700 C 1000,686 760,696 460,690 C 240,686 120,694 0,700 Z" fill="url(#hb-sea)"/>
    <path d="M 60,626 C 300,616 560,626 860,620" stroke="#f0c6a0" stroke-width="5" fill="none" opacity="0.6"/>
    <path d="M 160,656 C 400,648 660,656 980,650" stroke="#d7a0a8" stroke-width="4" fill="none" opacity="0.5"/>
    <path d="M 40,682 C 300,674 560,682 900,678" stroke="#e6b896" stroke-width="4" fill="none" opacity="0.5"/>
  </g>

  <!-- boat hulls (static; sit on the sea, flags on masts animate) -->
  <g id="hb-boats" fill="#2e2338">
    <path d="M 232,622 C 258,650 332,650 358,622 C 328,636 262,636 232,622 Z"/>
    <path d="M 962,628 C 988,656 1048,656 1074,628 C 1044,642 992,642 962,628 Z"/>
  </g>

  <!-- 2) RED FLAG (left mast) — flutter -->
  <g class="layer" data-name="flag">
    <path d="M 297,472 C 340,466 380,480 416,472 L 416,486 C 384,506 348,498 312,510 C 305,513 300,514 297,516 Z" fill="url(#hb-flag1)"/>
  </g>

  <!-- 3) BLUE FLAG (right mast) — flutter -->
  <g class="layer" data-name="banner">
    <path d="M 1020,488 C 1063,482 1103,496 1139,488 L 1139,502 C 1107,522 1071,514 1035,526 C 1028,529 1023,530 1020,532 Z" fill="url(#hb-flag2)"/>
  </g>

  <!-- 4) GULLS — drifting flight -->
  <g class="layer" data-name="gulls">
    <g stroke="#5a4152" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M 420,220 C 432,212 444,212 456,220"/>
      <path d="M 500,190 C 512,182 524,182 536,190"/>
      <path d="M 760,210 C 772,202 784,202 796,210"/>
      <path d="M 840,240 C 852,232 864,232 876,240"/>
      <path d="M 700,250 C 712,242 724,242 736,250"/>
    </g>
  </g>

  <!-- 5) PALM — frond sway (a coastal palm on the left dock) -->
  <g class="layer" data-name="palm">
    <path d="M 130,700 C 122,640 128,590 116,540 L 140,540 C 130,590 138,640 148,700 Z" fill="#2e2338"/>
    <g fill="#2a3a2e" opacity="0.95">
      <path d="M 128,542 C 90,516 66,520 44,536 C 78,528 104,534 128,552 Z"/>
      <path d="M 128,542 C 166,516 190,520 212,536 C 178,528 152,534 128,552 Z"/>
      <path d="M 128,540 C 100,506 96,486 104,462 C 112,492 122,516 130,540 Z"/>
      <path d="M 128,540 C 156,506 160,486 152,462 C 144,492 134,516 126,540 Z"/>
    </g>
  </g>

  <!-- ===== TITLE ===== -->
  <g class="layer" data-name="title">
    <text x="640" y="768" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
      font-size="46" font-weight="700" letter-spacing="3" fill="#fff2e2">Harbor's End</text>
  </g>
</svg>
