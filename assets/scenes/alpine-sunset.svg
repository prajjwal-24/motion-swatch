<svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- sunset sky: indigo → violet → rose → gold -->
    <linearGradient id="as-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#241a49"/>
      <stop offset="26%"  stop-color="#4b2f6e"/>
      <stop offset="50%"  stop-color="#8f4a72"/>
      <stop offset="72%"  stop-color="#d9705f"/>
      <stop offset="88%"  stop-color="#f4a04e"/>
      <stop offset="100%" stop-color="#ffd27a"/>
    </linearGradient>
    <!-- sun glow -->
    <radialGradient id="as-sunglow" cx="0.5" cy="1" r="0.9">
      <stop offset="0%"  stop-color="#fff2c4" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#ffd98a" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#f79a5c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f79a5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="as-sundisc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6dc"/><stop offset="70%" stop-color="#ffe9a8"/><stop offset="100%" stop-color="#ffd27a"/>
    </radialGradient>
    <!-- mountains -->
    <linearGradient id="as-mtn-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b07a86"/><stop offset="100%" stop-color="#8a5f7e"/>
    </linearGradient>
    <linearGradient id="as-mtn-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f4a70"/><stop offset="100%" stop-color="#4e3560"/>
    </linearGradient>
    <linearGradient id="as-mtn-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#382a52"/><stop offset="100%" stop-color="#241a3c"/>
    </linearGradient>
    <!-- lake mirrors the sky (flipped, muted) -->
    <linearGradient id="as-lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f0b268"/>
      <stop offset="18%" stop-color="#d97e63"/>
      <stop offset="48%" stop-color="#8a5075"/>
      <stop offset="100%" stop-color="#2c2048"/>
    </linearGradient>
    <linearGradient id="as-mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3c79a" stop-opacity="0"/>
      <stop offset="60%" stop-color="#f3c79a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f3c79a" stop-opacity="0"/>
    </linearGradient>
    <filter id="as-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="as-blurs" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <!-- vignette -->
    <radialGradient id="as-vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#160f28" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- ===== SKY (static) ===== -->
  <rect id="as-sky-rect" width="1280" height="470" fill="url(#as-sky)"/>
  <ellipse id="as-sun-glow" cx="640" cy="466" rx="520" ry="360" fill="url(#as-sunglow)"/>
  <circle id="as-sun" cx="640" cy="446" r="60" fill="url(#as-sundisc)"/>
  <!-- stars, only in the dark upper band -->
  <g id="as-stars" fill="#e8e0ff">
    <circle cx="140" cy="60" r="1.5" opacity="0.8"/><circle cx="360" cy="42" r="1.1" opacity="0.5"/>
    <circle cx="980" cy="54" r="1.4" opacity="0.7"/><circle cx="1180" cy="90" r="1.2" opacity="0.6"/>
    <circle cx="240" cy="120" r="1" opacity="0.4"/><circle cx="1080" cy="140" r="1" opacity="0.4"/>
  </g>

  <!-- ===== MOUNTAINS (static, atmospheric depth) ===== -->
  <path id="as-mtn-far" d="M 0,300 L 150,180 L 300,290 L 470,150 L 640,300 L 820,170 L 1000,300 L 1160,210 L 1280,300 L 1280,470 L 0,470 Z" fill="url(#as-mtn-far)" opacity="0.7"/>
  <path id="as-mtn-mid" d="M 0,360 L 210,230 L 420,360 L 640,250 L 880,370 L 1120,270 L 1280,360 L 1280,470 L 0,470 Z" fill="url(#as-mtn-mid)" opacity="0.9"/>
  <!-- rim light on the mid ridge (sun side) -->
  <path id="as-rim" d="M 640,250 L 700,285 M 880,370 L 940,335 M 420,360 L 480,325" stroke="#ffcf8a" stroke-width="2.5" fill="none" opacity="0.5"/>
  <path id="as-mtn-near" d="M 0,430 L 260,300 L 520,430 L 760,330 L 1040,440 L 1280,360 L 1280,470 L 0,470 Z" fill="url(#as-mtn-near)"/>
  <!-- snow caps -->
  <g id="as-snow" fill="#ffe9c4" opacity="0.85">
    <path d="M 470,150 L 500,196 L 440,196 Z"/><path d="M 820,170 L 850,214 L 790,214 Z"/>
  </g>
  <!-- mist band over the waterline -->
  <rect id="as-mist" x="0" y="420" width="1280" height="90" fill="url(#as-mist)" filter="url(#as-blur)"/>

  <!-- ===== LAKE (static base; the 'water' layer ripples on top) ===== -->
  <rect id="as-lake-rect" x="0" y="470" width="1280" height="330" fill="url(#as-lake)"/>
  <!-- mountain reflection (blurred, flipped, faint) -->
  <path id="as-refl" d="M 0,540 L 260,600 L 520,540 L 760,590 L 1040,532 L 1280,584 L 1280,470 L 0,470 Z" fill="url(#as-mtn-near)" opacity="0.22" filter="url(#as-blur)"/>
  <!-- sun reflection column -->
  <ellipse id="as-sunrefl" cx="640" cy="560" rx="60" ry="120" fill="#ffdb92" opacity="0.3" filter="url(#as-blur)"/>

  <!-- ===== ANIMATABLE: WATER (ripple in place) ===== -->
  <g class="layer" data-name="water">
    <g stroke="#ffd9a0" stroke-width="4" fill="none" opacity="0.55" stroke-linecap="round">
      <path d="M 120,520 C 340,512 560,524 820,518"/>
      <path d="M 420,552 C 620,545 820,556 1080,550"/>
      <path d="M 80,590 C 320,582 560,592 900,586"/>
    </g>
    <g stroke="#d98a7c" stroke-width="3.5" fill="none" opacity="0.45" stroke-linecap="round">
      <path d="M 200,634 C 440,626 700,636 1000,630"/>
      <path d="M 120,680 C 380,672 640,682 980,676"/>
      <path d="M 320,724 C 560,716 800,726 1120,720"/>
    </g>
    <g stroke="#8a5a80" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round">
      <path d="M 60,760 C 340,752 620,762 1020,756"/>
    </g>
  </g>

  <!-- ===== ANIMATABLE: CLOUDS (drift) ===== -->
  <g class="layer" data-name="clouds">
    <g fill="#ffe6c4" opacity="0.7" filter="url(#as-blurs)">
      <ellipse cx="280" cy="150" rx="140" ry="20"/><ellipse cx="360" cy="168" rx="90" ry="14"/>
      <ellipse cx="1000" cy="120" rx="130" ry="18"/><ellipse cx="1070" cy="136" rx="80" ry="12"/>
      <ellipse cx="640" cy="90" rx="100" ry="12" opacity="0.6"/>
    </g>
  </g>

  <!-- ===== ANIMATABLE: BIRDS (fly) ===== -->
  <g class="layer" data-name="birds">
    <g stroke="#2a1f3e" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M 430,220 C 444,210 458,210 472,220"/>
      <path d="M 500,196 C 514,186 528,186 542,196"/>
      <path d="M 560,226 C 574,216 588,216 602,226"/>
      <path d="M 470,250 C 484,240 498,240 512,250"/>
      <path d="M 380,244 C 394,234 408,234 422,244"/>
    </g>
  </g>

  <!-- ===== ANIMATABLE: PINE TREES (sway) — foreground silhouettes ===== -->
  <g class="layer" data-name="trees">
    <g fill="#191228">
      <path d="M 90,800 L 90,560 M 40,600 L 90,560 L 140,600 M 52,650 L 90,616 L 128,650 M 60,700 L 90,672 L 120,700 M 66,748 L 90,724 L 114,748" stroke="#191228" stroke-width="7" fill="none" stroke-linejoin="round"/>
      <path d="M 190,800 L 190,600 M 152,632 L 190,600 L 228,632 M 160,676 L 190,648 L 220,676 M 166,720 L 190,696 L 214,720" stroke="#191228" stroke-width="6" fill="none" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- vignette on top -->
  <rect id="as-vignette" width="1280" height="800" fill="url(#as-vig)" pointer-events="none"/>

  <!-- ===== TITLE — bottom-right safe zone, no animated object here ===== -->
  <g class="layer" data-name="title">
    <text x="1200" y="740" text-anchor="end" font-family="Georgia, 'Times New Roman', serif"
      font-size="42" font-weight="700" letter-spacing="3" fill="#fdeede">Lake Verai</text>
    <text x="1200" y="770" text-anchor="end" font-family="-apple-system, Helvetica, sans-serif"
      font-size="14" font-weight="500" letter-spacing="8" fill="#e8b78e">ALPINE RESERVE</text>
  </g>
</svg>
